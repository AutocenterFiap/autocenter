# ===========================================
# Application Test Configuration
# ===========================================
spring.application.name=auto-center-fiap-test

# ===========================================
# Server Configuration
# ===========================================
server.port=8097

# ===========================================
# H2 Database Configuration (Test)
# ===========================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===========================================
# H2 Console (Disabled for tests)
# ===========================================
spring.h2.console.enabled=false

# ===========================================
# JPA / Hibernate
# ===========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# Flyway Configuration
# ===========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===========================================
# Security Configuration for Tests
# ===========================================
api.security.token.secret=${JWT_SECRET:test-secret-key-for-testing-purposes-only}

# ===========================================
# Logging
# ===========================================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.br.com.autocenterfiap=DEBUG
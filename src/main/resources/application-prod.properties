spring.application.name=auto-center-fiap

# ========================================
# Configurações JWT
# ========================================
sistema.seguranca.chave.secreta=123456789
sistema.cache.expiracao.minutos=25
sistema.token.expiracao.minutos=30

# ========================================
# Configurações do Servidor
# ========================================
server.port=8097

# ========================================
# Configurações do Banco de Dados MySQL
# ========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/autocenter?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:autocenter_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:autocenter123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# Configurações do Flyway (Migrations)
# ========================================
spring.flyway.enabled=true
spring.flyway.locations=filesystem:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ========================================
# Configurações do JPA/Hibernate
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ========================================
# Swagger/OpenAPI (acesse em: http://localhost:8097/swagger-ui.html)
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha

# Executar a cada 10 minutos
orcamento.scheduler.fixedDelay=60000


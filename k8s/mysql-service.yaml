apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: auto-center
  labels:
    app: mysql
    component: database
spec:
  type: ClusterIP   # Apenas acessível internamente no cluster
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP


name: CI/CD — Auto Center FIAP

# ──────────────────────────────────────────────────────────────────────────────
# REQUISITO: self-hosted runner instalado e rodando na sua máquina local.
#
# Instalação rápida:
#   1. Acesse: GitHub → Repositório → Settings → Actions → Runners → New self-hosted runner
#   2. Siga as instruções para Linux (baixar, configurar e iniciar o runner)
#   3. O runner precisa ter instalado: Docker, kubectl e minikube (ou kind)
#
# GitHub Secrets necessários (Settings → Secrets and variables → Actions):
#   MYSQL_ROOT_PASSWORD   — senha root do MySQL
#   MYSQL_DATABASE        — nome do banco (ex: autocenter)
#   MYSQL_USER            — usuário da aplicação (ex: autocenter_user)
#   MYSQL_PASSWORD        — senha do usuário
#   INFISICAL_CLIENT_ID   — client ID do Infisical
#   INFISICAL_CLIENT_SECRET — client secret do Infisical
#   INFISICAL_PROJECT_ID  — project ID do Infisical
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - master
      - clean-architecture
      - clean/ci-cd
  pull_request:
    branches:
      - main
      - master
      - clean-architecture
      - clean/ci-cd

env:
  IMAGE_NAME: auto-center-fiap
  K8S_NAMESPACE: auto-center
  JAVA_VERSION: '21'

jobs:

  # ─────────────────────────────────────────────────────────────────
  # JOB 1 — Build da aplicação + Execução dos testes automatizados
  # Roda no runner do GitHub — não precisa de recursos locais.
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build e execução dos testes automatizados (Maven + JaCoCo)
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Publicar relatório de testes (Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Publicar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Salvar JAR como artefato para o job de Docker
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/auto-center-fiap-*.jar
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 — Build da imagem Docker
  # Roda no self-hosted runner (máquina local) para que a imagem
  # fique disponível no daemon Docker acessado pelo cluster local.
  # ─────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Build da Imagem Docker
    runs-on: self-hosted
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: |
          docker build \
            -f docker/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .
          echo "✅ Imagem ${{ env.IMAGE_NAME }}:latest construída."

      - name: Carregar imagem no Minikube (se disponível)
        run: |
          if command -v minikube &>/dev/null && minikube status 2>/dev/null | grep -q "Running"; then
            echo "Carregando imagem no Minikube..."
            minikube image load ${{ env.IMAGE_NAME }}:latest
            echo "✅ Imagem carregada no Minikube."
          else
            echo "ℹ️  Minikube não ativo. Pulando carga de imagem."
          fi

      - name: Carregar imagem no Kind (se disponível)
        run: |
          if command -v kind &>/dev/null && kind get clusters 2>/dev/null | grep -q .; then
            CLUSTER=$(kind get clusters | head -1)
            echo "Carregando imagem no Kind (cluster: $CLUSTER)..."
            kind load docker-image ${{ env.IMAGE_NAME }}:latest --name "$CLUSTER"
            echo "✅ Imagem carregada no Kind."
          else
            echo "ℹ️  Kind não ativo. Pulando carga de imagem."
          fi

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy do banco de dados MySQL no cluster Kubernetes local
  # ─────────────────────────────────────────────────────────────────
  deploy-database:
    name: 🗄️ Deploy Banco de Dados (MySQL)
    runs-on: self-hosted
    needs: docker-build
    if: github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar conexão com o cluster
        run: |
          echo "Cluster atual: $(kubectl config current-context)"
          kubectl get nodes

      - name: Criar namespace (se não existir)
        run: kubectl apply -f k8s/namespace.yaml

      - name: Criar/atualizar ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Criar/atualizar Secrets (a partir dos GitHub Secrets)
        run: |
          kubectl create secret generic auto-center-secrets \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --from-literal=MYSQL_DATABASE="${{ secrets.MYSQL_DATABASE }}" \
            --from-literal=MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            --from-literal=MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --from-literal=INFISICAL_CLIENT_ID="${{ secrets.INFISICAL_CLIENT_ID }}" \
            --from-literal=INFISICAL_CLIENT_SECRET="${{ secrets.INFISICAL_CLIENT_SECRET }}" \
            --from-literal=INFISICAL_PROJECT_ID="${{ secrets.INFISICAL_PROJECT_ID }}" \
            --save-config \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          echo "✅ Secrets criados/atualizados."

      - name: Aplicar PVC do MySQL
        run: kubectl apply -f k8s/mysql-pvc.yaml

      - name: Deploy do MySQL (Deployment + Service)
        run: |
          kubectl apply -f k8s/mysql-deployment.yaml
          kubectl apply -f k8s/mysql-service.yaml

      - name: Aguardar MySQL ficar pronto
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=mysql \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s
          echo "✅ MySQL pronto."

  # ─────────────────────────────────────────────────────────────────
  # JOB 4 — Deploy da aplicação + aplicação dos manifestos YAML
  # Aplica todos os manifestos via Kustomize e aguarda o rollout.
  # ─────────────────────────────────────────────────────────────────
  deploy-app:
    name: 🚀 Deploy da Aplicação (Kubernetes local)
    runs-on: self-hosted
    needs: deploy-database
    if: github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Aplicar todos os manifestos YAML com Kustomize
        run: |
          echo "--- Aplicando manifestos via kustomize ---"
          kubectl apply -k k8s/
          echo "✅ Manifestos aplicados."

      - name: Aguardar rollout da aplicação
        run: |
          kubectl rollout status deployment/auto-center-fiap \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s
          echo "✅ Aplicação implantada com sucesso."

      - name: Verificar status final do deploy
        if: always()
        run: |
          echo "========== PODS =========="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide

          echo "========== SERVICES =========="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}

          echo "========== DEPLOYMENTS =========="
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}

          echo "========== HPA =========="
          kubectl get hpa -n ${{ env.K8S_NAMESPACE }} || true

          echo "========== EVENTOS RECENTES =========="
          kubectl get events -n ${{ env.K8S_NAMESPACE }} \
            --sort-by='.lastTimestamp' | tail -20

services:
  mysql:
    image: mysql:8.0
    container_name: autocenter-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Aut0c3nt3rfiap
      MYSQL_DATABASE: autocenterdb
      MYSQL_USER: autocenter
      MYSQL_PASSWORD: autocenter123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - autocenter-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  autocenterfiap:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: autocenter-app
    ports:
      - "8097:8097"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/autocenterdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: autocenter
      SPRING_DATASOURCE_PASSWORD: autocenter123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      # Para habilitar o Datadog localmente, descomente as linhas abaixo:
      JAVA_TOOL_OPTIONS: "-javaagent:/app/dd-java-agent.jar"
      DD_AGENT_HOST: datadog
      DD_ENV: dev
      DD_SERVICE: auto-center-fiap
      DD_VERSION: 1.0.0
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.check_names: '["openmetrics"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"prometheus_url": "http://autocenter-app:8097/actuator/prometheus", "namespace": "autocenter", "metrics": ["autocenter_*"]}]'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - autocenter-network

  # Para rodar o Datadog Agent localmente via docker-compose:
  datadog:
    image: gcr.io/datadoghq/agent:latest
    container_name: autocenter-datadog
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    ports:
      - "8126:8126"
      - "8125:8125/udp"
    networks:
      - autocenter-network

volumes:
  mysql-data:
    driver: local

networks:
  autocenter-network:
    driver: bridge
spring.application.name=auto-center-fiap

# ========================================
# Configurações JWT
# ========================================
sistema.seguranca.chave.secreta=123456789
sistema.cache.expiracao.minutos=25
sistema.token.expiracao.minutos=30

# ========================================
# Configurações do Servidor
# ========================================
server.port=8097

# ========================================
# Configurações do Banco de Dados H2
# ========================================
spring.datasource.url=jdbc:h2:mem:autocenterdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.baseline-on-migrate=true

# ========================================
# Configurações do Flyway (Migrations)
# ========================================
spring.flyway.enabled=true
spring.flyway.locations=filesystem:db/migration
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ========================================
# Console H2 (acesse em: http://localhost:8097/h2-console)
# ========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================
# Configurações do JPA/Hibernate
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ========================================
# Swagger/OpenAPI (acesse em: http://localhost:8097/swagger-ui.html)
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha

spring.application.name=auto-center-fiap

# ========================================
# Configurações JWT
# ========================================
sistema.seguranca.chave.secreta=123456789
sistema.token.expiracao.minutos=30
sistema.cache.expiracao.minutos=25

# ========================================
# Configurações do Servidor
# ========================================
server.port=8097

# ========================================
# Configurações do Banco de Dados H2
# ========================================
spring.datasource.url=jdbc:h2:mem:autocenterdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ========================================
# Configurações do JPA/Hibernate
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# Configurações do Flyway (Migrations)
# ========================================
spring.flyway.enabled=true
spring.flyway.locations=filesystem:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ========================================
# Console H2 (acesse em: http://localhost:8097/h2-console)
# ========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
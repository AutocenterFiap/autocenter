apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-center

resources:
  # 1. Namespace (deve ser aplicado primeiro)
  - namespace.yaml
  # 2. Configurações
  # secret.yaml é criado pelo pipeline CI/CD via 'kubectl create secret generic'
  # e NÃO deve ser versionado no repositório por segurança.
  - configmap.yaml
  # 3. Banco de dados
  - mysql-pvc.yaml
  - mysql-deployment.yaml
  - mysql-service.yaml
  # 4. Aplicação
  - app-deployment.yaml
  - app-service.yaml
  # 5. Autoscaling
  - hpa.yaml

# 'labels' com includeSelectors: false evita modificar spec.selector
# (que é imutável após criação do Deployment).
labels:
  - pairs:
      managed-by: kustomize
      project: auto-center-fiap
    includeSelectors: false
    includeTemplates: true

